hero:
  eyebrow: "Création de sites internet · Référencement SEO · Performance web"
  title: "Artisan du web, je conçois des sites sur mesure pour votre activité"
  intro: >-
    Je suis Cédric Ruiu, développeur web indépendant à Séné, dans le Morbihan. Je conçois des sites internet pour les artisans, indépendants et petites entreprises, en Bretagne comme partout en France. Développement, référencement et performance : vous avez un seul interlocuteur, du premier échange à la mise en ligne.
  primary:
    label: "Me contacter"
    url: "/contact/"
  secondary:
    label: "Voir mes projets"
    url: "/portfolio/"

expertise:
  eyebrow: "Ce que je fais"
  title: "Trois expertises, une seule personne"
  intro: >-
    Créer un site, le rendre visible et le garder rapide sont trois expertises différentes. Je les réunis au même endroit pour que votre site reste cohérent de la conception jusqu'à ses performances.
  # One teaser paragraph per card: the detail lives on the service page, so
  # nothing is said twice. `service` is a key from services.yml, which supplies
  # the icon and the URL; `link` is the card's own descriptive anchor text.
  items:
    - service: "creation"
      title: "Création de site internet"
      text: >-
        Je conçois et développe votre site de A à Z, du premier échange à la mise en ligne : site vitrine, boutique en ligne, application web ou mobile, textes compris si vous le souhaitez. Vous échangez directement avec la personne qui réalise le projet, sans intermédiaire.
      link: "Découvrir la création de site"
    - service: "seo"
      title: "Référencement SEO"
      text: >-
        Être présent sur Google ne suffit pas : encore faut-il apparaître devant les bonnes personnes. Mon audit SEO identifie précisément ce qui freine votre visibilité, et vous remet un rapport d'actions hiérarchisé — que vous pouvez appliquer vous-même ou me confier.
      link: "Tout savoir sur l'audit SEO"
    - service: "performance"
      title: "Performance"
      text: >-
        Un site rapide est plus agréable à utiliser, surtout sur mobile et avec une connexion moyenne. Je conçois des sites légers dès le départ, et je peux mesurer le vôtre pour trouver ce qui le ralentit.
      link: "En savoir plus sur la performance web"

why:
  eyebrow: "Pourquoi travailler avec moi"
  title: "La personne qui code est celle à qui vous parlez"
  intro: >-
    Je suis installé à Séné, dans le Morbihan. Je privilégie les échanges directs et je peux me déplacer dans le secteur de Vannes et du Golfe du Morbihan. Pour les projets ailleurs en France, je travaille simplement à distance, par téléphone ou en visio.
  # Served as delivered, bypassing `responsiveImage`: re-encoding (AVIF included)
  # came out heavier at equal quality. The number in each filename IS its pixel
  # width, repeated by the template as the srcset `w` descriptor — keep them in
  # sync when renaming a file.
  photo:
    alt: "Cédric Ruiu, développeur web indépendant à Séné, dans le Morbihan."
    landscape: "/cedric-ruiu-portrait-paysage-600.webp"
    portrait: "/cedric-ruiu-portrait-787.webp"
    portraitLarge: "/cedric-ruiu-portrait-1559.webp"
  items:
    - title: "Un seul interlocuteur"
      text: >-
        Vous expliquez votre activité une seule fois. Pas d'intermédiaire ni de relais entre plusieurs prestataires : la personne qui comprend votre besoin est aussi celle qui conçoit, développe et met en ligne votre site.
    - title: "Vingt ans de métier"
      text: >-
        Je développe des sites et des applications web depuis de nombreuses années, avec une expertise particulière en développement frontend, SEO technique et performance. Cette expérience me permet d'aborder un projet avec une vraie exigence technique, tout en restant adapté aux besoins d'une petite structure.
    - title: "Un site qui vous appartient"
      text: >-
        Le code, les textes, les images et le nom de domaine sont à vous. Vous pouvez reprendre la main, changer de prestataire ou faire évoluer votre site : rien n'est enfermé dans un abonnement ou un outil dont vous n'auriez pas les clés.

cta:
  title: "Un projet en tête ?"
  text: >-
    Dites-moi ce que vous faites et ce que vous aimeriez améliorer. Je vous réponds avec un premier avis honnête — y compris si la meilleure solution n'est pas de refaire votre site.
  button:
    label: "Me contacter"
    url: "/contact/"
